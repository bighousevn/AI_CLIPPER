app = "ai-clipper-backend"

primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[[vm]]
  size = "shared-cpu-1x"  
  memory = "512mb"        
  cpu_kind = "shared"
  cpus = 1

[[services]]
  protocol = "tcp"
  internal_port = 8080      
  processes = ["app"]       

  auto_stop_machines = true 
  auto_start_machines = true 
  min_machines_running = 0

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

[env]
  GIN_MODE = "release"
  TZ = "Asia/Ho_Chi_Minh" 